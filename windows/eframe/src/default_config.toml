# eframe-jack-in default configuration.
#
# Each [[target]] binds a global hotkey to an application. When pressed:
#   - the tray program looks for a top-level window matching `match` and
#     brings it to the foreground (cycling through hits on repeat press);
#   - if no matching window exists, the `launch` command is spawned;
#   - for Emacs specifically, `always_launch_if_no_window = true` also fires
#     the launch when a matched frame is present but obscured — emacsclient
#     is idempotent and cheap to call.
#
# `match` predicates combine conjunctively (AND). Any field may be omitted.
# The `class` / `exe` fields below are educated guesses — verify on your
# machine with `eframe-jack-in.exe --list-windows`.
#
# Environment variables (%EMACS%, %LOCALAPPDATA%, %ProgramFiles%, ~) are
# expanded inside string values.

[[target]]
name = "Emacs"
hotkey = "Ctrl+Alt+E"
match = { class = "Emacs" }
launch = '''"%EMACS%\bin\emacsclientw.exe" --no-wait --alternate-editor="%EMACS%\bin\runemacs.exe" "~\.emacs.d\touch"'''
always_launch_if_no_window = true

[[target]]
name = "Google Chrome"
hotkey = "Ctrl+Alt+W"
match = { exe = "chrome.exe", class = "Chrome_WidgetWin_1" }
launch = "chrome.exe"

[[target]]
name = "muCommander"
hotkey = "Ctrl+Alt+M"
match = { class = "SunAwtFrame", title = "(?i)mucommander" }
launch = '''%ProgramFiles%\muCommander\muCommander.exe'''

[[target]]
name = "PowerShell"
hotkey = "Ctrl+Alt+Q"
# Match by exe only, not title — the WT window title reflects the active
# tab name, so renaming a tab breaks a title predicate and Ctrl+Alt+Q ends
# up spawning a second wt.exe instead of activating the existing one.
# Trade-off: if multiple WT windows are open, the hotkey cycles between
# them regardless of what shell each one hosts. Which tabs live inside a
# WT window isn't exposed via Win32 API.
match = { exe = "WindowsTerminal.exe" }
launch = "wt.exe -p \"Windows PowerShell\""

[[target]]
name = "Microsoft Edge"
hotkey = "Ctrl+Alt+D"
match = { exe = "msedge.exe", class = "Chrome_WidgetWin_1" }
launch = "msedge.exe"

[[target]]
name = "Slack"
hotkey = "Ctrl+Alt+S"
match = { exe = "slack.exe", class = "Chrome_WidgetWin_1" }
launch = '''%LOCALAPPDATA%\slack\slack.exe'''

[[target]]
name = "IntelliJ IDEA"
hotkey = "Ctrl+Alt+I"
# IntelliJ (like other JetBrains IDEs) is a Swing app → class SunAwtFrame,
# same as muCommander. Disambiguate by exe. `idea64.exe` is the 64-bit
# launcher; older installs may use `idea.exe`. Toolbox installs live under
# %LOCALAPPDATA%\Programs\IntelliJ IDEA Ultimate\bin\idea64.exe — if App
# Paths doesn't find it, replace with the absolute path.
match = { exe = "idea64.exe", class = "SunAwtFrame" }
launch = "idea64.exe"

[[target]]
name = "VS Code"
hotkey = "Ctrl+Alt+V"
# VS Code is Electron → same Chrome_WidgetWin_1 as Chrome/Edge/Slack.
# Disambiguate by exe. Standard installer registers Code.exe in App Paths;
# user-scope install typically lives at %LOCALAPPDATA%\Programs\Microsoft VS Code\Code.exe.
match = { exe = "Code.exe", class = "Chrome_WidgetWin_1" }
launch = "Code.exe"

[[target]]
name = "Minimize"
hotkey = "Alt+Z"
# Special action — minimize whatever window has focus right now. Ignores
# `match` and `launch`. Shell surfaces (desktop / taskbar) are skipped so
# the desktop can't accidentally be minimized when nothing else has focus.
action = "minimize-foreground"
